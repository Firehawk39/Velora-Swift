name: iOS Build

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build App (Unsigned)
        run: |
          set +e
          xcodebuild clean build \
            -scheme Velora \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath $PWD/DerivedData \
            -sdk iphoneos \
            ARCHS=arm64 \
            TARGETED_DEVICE_FAMILY="1,2" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            ENTITLEMENTS_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO | tee build.log

          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "========================================"
            echo "💥 EXTRACTED SWIFT COMPILER ERRORS:"
            echo "========================================"
            grep -E "error:|Error:" build.log -B 2 -A 2
            exit 1
          fi
          set -e

      - name: Build IPA (Jailbreak Optimized)
        run: |
          # 1. Find the compiled app bundle in DerivedData
          APP_PATH="DerivedData/Build/Products/Release-iphoneos/Velora.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "CRITICAL: Failed to find Velora.app in DerivedData"
            exit 1
          fi
          
          # 2. Create Payload structure
          rm -rf Payload
          mkdir Payload
          
          # 3. Copy the entire compiled .app bundle (preserves proper Info.plist, frameworks, background modes, etc)
          cp -R "$APP_PATH" Payload/
          
          # 4. Strip Swift 6 specific load commands if necessary (optional, but good for older jailbreaks)
          if [ -f "Payload/Velora.app/Velora" ]; then
            xcrun strip -S "Payload/Velora.app/Velora" || true
          fi
          
          # 5. Zip into IPA
          zip -r9 Velora-Jailbreak.ipa Payload


      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velora-Jailbreak
          path: Velora-Jailbreak.ipa
          retention-days: 7
