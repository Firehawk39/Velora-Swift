name: iOS Build

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch: # Allows you to trigger the build manually from the GitHub website

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14 # Uses Apple Silicon M1/M2 runners which are much faster

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build Archive
        run: |
          xcodebuild archive \
            -scheme Velora \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $PWD/Velora.xcarchive \
            -sdk iphoneos \
            ARCHS=arm64 \
            TARGETED_DEVICE_FAMILY="1,2" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            ENTITLEMENTS_ALLOWED=NO

      - name: Export to IPA
        run: |
          mkdir -p Payload
          cp -r $PWD/Velora.xcarchive/Products/Applications/Velora.app Payload/
          zip -r Velora.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velora
          path: Velora.ipa
          retention-days: 7
