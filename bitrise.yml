app:
  envs:
  - BITRISE_SCHEME: Velora
    opts:
      is_expand: false
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
format_version: "26"
meta:
  bitrise.io:
    machine_type_id: g2.mac.large
    stack: osx-xcode-27.0.x
project_type: ios
workflows:
  build:
    description: Builds unsigned IPA for Velora Swift Package iOS app.
    summary: Build unsigned IPA from Package.swift
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - script@1:
        title: Build XCArchive and Unsigned IPA
        inputs:
        - content: |
            #!/usr/bin/env bash
            set -eo pipefail

            echo "=== Building XCArchive from Package.swift ==="
            xcodebuild archive \
              -scheme "$BITRISE_SCHEME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath Velora.xcarchive \
              -sdk iphoneos \
              ARCHS=arm64 \
              TARGETED_DEVICE_FAMILY="1,2" \
              INSTALL_PATH=/Applications \
              PRODUCT_NAME=Velora \
              WRAPPER_EXTENSION=app \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE="" \
              ENTITLEMENTS_ALLOWED=NO \
              ARCHIVE=YES \
              generate_infoplist_file=YES \
              COMPILER_INDEX_STORE_ENABLE=NO | tee build.log

            if [ ${PIPESTATUS[0]} -ne 0 ]; then
              echo "💥 EXTRACTED SWIFT ERRORS:"
              grep -C 5 "error:" build.log
              exit 1
            fi

            echo "=== Locating compiled binary ==="
            BINARY_PATH=$(find Velora.xcarchive/Products -type f -perm +111 -not -name "*.plist" -not -name "*.otf" | head -n 1)
            BINARY_NAME="Velora"

            if [ -z "$BINARY_PATH" ]; then
              echo "CRITICAL: Failed to find binary in Velora.xcarchive"
              exit 1
            fi

            echo "=== Creating Payload and assembling App Bundle ==="
            rm -rf Payload
            mkdir -p "Payload/Velora.app"
            PAYLOAD_APP="Payload/Velora.app"

            cp "$BINARY_PATH" "$PAYLOAD_APP/$BINARY_NAME"
            chmod +x "$PAYLOAD_APP/$BINARY_NAME"
            xcrun strip -S -x "$PAYLOAD_APP/$BINARY_NAME" 2>/dev/null || xcrun strip "$PAYLOAD_APP/$BINARY_NAME" 2>/dev/null || true

            # Copy fonts & bundled assets
            cp Sources/App/Resources/Stardom-Regular.otf "$PAYLOAD_APP/" 2>/dev/null || true
            find Velora.xcarchive/Products -name "*.otf" -exec cp {} "$PAYLOAD_APP/" \;
            find Velora.xcarchive/Products -name "Assets.car" -exec cp {} "$PAYLOAD_APP/" \;
            find Velora.xcarchive/Products -name "*.png" -exec cp {} "$PAYLOAD_APP/" \;
            find Velora.xcarchive/Products -name "*.bundle" -exec cp -R {} "$PAYLOAD_APP/" \;

            # Write Info.plist
            cat <<'EOF' > "$PAYLOAD_APP/Info.plist"
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
                <key>CFBundleExecutable</key>
                <string>Velora</string>
                <key>CFBundleIdentifier</key>
                <string>com.velora.aistudio</string>
                <key>CFBundleInfoDictionaryVersion</key>
                <string>6.0</string>
                <key>CFBundleName</key>
                <string>Velora</string>
                <key>CFBundlePackageType</key>
                <string>APPL</string>
                <key>CFBundleShortVersionString</key>
                <string>1.0</string>
                <key>CFBundleVersion</key>
                <string>1</string>
                <key>LSRequiresIPhoneOS</key>
                <true/>
                <key>UIDeviceFamily</key>
                <array>
                    <integer>1</integer>
                    <integer>2</integer>
                </array>
                <key>UIAppFonts</key>
                <array>
                    <string>Stardom-Regular.otf</string>
                </array>
                <key>MinimumOSVersion</key>
                <string>15.0</string>
                <key>UIRequiredDeviceCapabilities</key>
                <array>
                    <string>arm64</string>
                </array>
                <key>UIBackgroundModes</key>
                <array>
                    <string>audio</string>
                </array>
                <key>UIRequiresFullScreen</key>
                <true/>
                <key>UILaunchScreen</key>
                <dict/>
                <key>UISupportedInterfaceOrientations</key>
                <array>
                    <string>UIInterfaceOrientationPortrait</string>
                    <string>UIInterfaceOrientationLandscapeLeft</string>
                    <string>UIInterfaceOrientationLandscapeRight</string>
                </array>
                <key>UISupportedInterfaceOrientations~ipad</key>
                <array>
                    <string>UIInterfaceOrientationPortrait</string>
                    <string>UIInterfaceOrientationPortraitUpsideDown</string>
                    <string>UIInterfaceOrientationLandscapeLeft</string>
                    <string>UIInterfaceOrientationLandscapeRight</string>
                </array>
                <key>NSAppTransportSecurity</key>
                <dict>
                    <key>NSAllowsArbitraryLoads</key>
                    <true/>
                    <key>NSAllowsLocalNetworking</key>
                    <true/>
                </dict>
                <key>CFBundleIcons</key>
                <dict>
                    <key>CFBundlePrimaryIcon</key>
                    <dict>
                        <key>CFBundleIconFiles</key>
                        <array>
                            <string>AppIcon20x20</string>
                            <string>AppIcon29x29</string>
                            <string>AppIcon40x40</string>
                            <string>AppIcon60x60</string>
                        </array>
                    </dict>
                </dict>
                <key>CFBundleIcons~ipad</key>
                <dict>
                    <key>CFBundlePrimaryIcon</key>
                    <dict>
                        <key>CFBundleIconFiles</key>
                        <array>
                            <string>AppIcon20x20</string>
                            <string>AppIcon29x29</string>
                            <string>AppIcon40x40</string>
                            <string>AppIcon76x76</string>
                            <string>AppIcon83.5x83.5</string>
                        </array>
                    </dict>
                </dict>
                <key>NSLocalNetworkUsageDescription</key>
                <string>Velora needs to connect to your Navidrome server.</string>
                <key>NSBonjourServices</key>
                <array>
                    <string>_http._tcp</string>
                    <string>_subsonic._tcp</string>
                </array>
                <key>CFBundleSupportedPlatforms</key>
                <array>
                    <string>iPhoneOS</string>
                </array>
                <key>DTPlatformName</key>
                <string>iphoneos</string>
                <key>DTSDKName</key>
                <string>iphoneos</string>
            </dict>
            </plist>
            EOF

            # Map app icons
            ICON_SOURCE="Sources/App/Resources/Assets.xcassets/AppIcon.appiconset"
            if [ -d "$ICON_SOURCE" ]; then
                echo "Injecting icons from $ICON_SOURCE..."
                cp "$ICON_SOURCE/AppIcon@2x.png" "$PAYLOAD_APP/AppIcon60x60@2x.png" 2>/dev/null || true
                cp "$ICON_SOURCE/AppIcon@3x.png" "$PAYLOAD_APP/AppIcon60x60@3x.png" 2>/dev/null || true
                cp "$ICON_SOURCE/AppIcon-83.5@2x~ipad.png" "$PAYLOAD_APP/AppIcon83.5x83.5@2x.png" 2>/dev/null || true
                cp "$ICON_SOURCE/AppIcon~ipad.png" "$PAYLOAD_APP/AppIcon76x76.png" 2>/dev/null || true
                cp "$ICON_SOURCE/AppIcon@2x~ipad.png" "$PAYLOAD_APP/AppIcon76x76@2x.png" 2>/dev/null || true
                cp "$ICON_SOURCE/AppIcon-60@2x~car.png" "$PAYLOAD_APP/AppIcon60x60@2x~car.png" 2>/dev/null || true
                cp "$ICON_SOURCE/AppIcon-60@3x~car.png" "$PAYLOAD_APP/AppIcon60x60@3x~car.png" 2>/dev/null || true
                cp "$ICON_SOURCE/AppIcon-20@2x.png" "$PAYLOAD_APP/AppIcon20x20@2x.png" 2>/dev/null || true
                cp "$ICON_SOURCE/AppIcon-20@3x.png" "$PAYLOAD_APP/AppIcon20x20@3x.png" 2>/dev/null || true
                cp "$ICON_SOURCE/AppIcon-20~ipad.png" "$PAYLOAD_APP/AppIcon20x20~ipad.png" 2>/dev/null || true
                cp "$ICON_SOURCE/AppIcon-29.png" "$PAYLOAD_APP/AppIcon29x29.png" 2>/dev/null || true
                cp "$ICON_SOURCE/AppIcon-29@2x.png" "$PAYLOAD_APP/AppIcon29x29@2x.png" 2>/dev/null || true
                cp "$ICON_SOURCE/AppIcon-29@3x.png" "$PAYLOAD_APP/AppIcon29x29@3x.png" 2>/dev/null || true
                cp "$ICON_SOURCE/AppIcon-40@2x.png" "$PAYLOAD_APP/AppIcon40x40@2x.png" 2>/dev/null || true
                cp "$ICON_SOURCE/AppIcon-40@3x.png" "$PAYLOAD_APP/AppIcon40x40@3x.png" 2>/dev/null || true
                cp "$ICON_SOURCE/AppIcon-40~ipad.png" "$PAYLOAD_APP/AppIcon40~ipad.png" 2>/dev/null || true
                cp "$ICON_SOURCE"/*.png "$PAYLOAD_APP/" 2>/dev/null || true
            fi

            chmod +x "$PAYLOAD_APP/$BINARY_NAME"
            echo "=== Packaging Artifacts to BITRISE_DEPLOY_DIR ==="
            zip -r Velora-Jailbreak.ipa Payload

            # Bitrise's deploy-to-bitrise-io requires signed embedded.mobileprovision for raw .ipa files.
            # We deploy as .tipa (TrollStore format) and .zip (containing .ipa) for 100% clean CI deployment.
            cp Velora-Jailbreak.ipa "$BITRISE_DEPLOY_DIR/Velora-Jailbreak.tipa"
            zip -j "$BITRISE_DEPLOY_DIR/Velora-Jailbreak.zip" Velora-Jailbreak.ipa
    - deploy-to-bitrise-io@2: {}
    triggers:
      pull_request:
      - source_branch: '*'
      push:
      - branch: master
